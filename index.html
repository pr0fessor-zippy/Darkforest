<title>He Won’t Stop</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bone:#d8d2c0;--blood:#a31d1d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03060a;overflow:hidden;color:var(--bone);font-family:'IM Fell English',Georgia,serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#vig,#flash{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,transparent 38%,#000 105%)}
#flash{background:#fff;opacity:0}
#hud{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));font-size:20px;text-shadow:0 0 6px #000;pointer-events:none}
#sta{width:150px;height:4px;background:#1c1c1c;margin-top:8px}#sta i{display:block;height:100%;width:100%;background:var(--bone)}
#msg{position:fixed;left:0;right:0;bottom:calc(14% + env(safe-area-inset-bottom,0px));text-align:center;font-size:22px;font-style:italic;opacity:0;transition:opacity .7s;pointer-events:none;text-shadow:0 0 8px #000}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:rgba(0,0,0,.82)}
h1{margin:0;font-weight:400;font-size:clamp(40px,9vw,92px);color:var(--blood);text-shadow:0 0 24px #5a0000}
p{margin:0;max-width:44ch;line-height:1.5;font-size:19px}
.s{font-size:15px;opacity:.65}
button,label{font:inherit;color:var(--bone);background:none;border:1px solid var(--bone);padding:10px 28px;font-size:20px;cursor:pointer}
label{font-size:15px;padding:6px 14px;opacity:.7}
button:hover,button:focus-visible,label:hover{background:var(--bone);color:#000;outline:none}
@media(prefers-reduced-motion:reduce){#msg{transition:none}}

<div id="ov"><h1 id="t">He Won’t Stop</h1><p id="d">Night. A forest with no trail. Five lights burn somewhere between the trees. Find them all and the way out opens. Don’t let him catch you.</p><button id="go">Enter the forest</button><p class="s">WASD to move, Shift to sprint, mouse to look (click to capture it). On touch, left thumb moves and right thumb looks. Headphones help.</p><label>Swap chaser photo<input id="f" type="file" accept="image/*" hidden></label></div>

 E.set((Math.random()-.5)*.08,Math.random()*6.28,(Math.random()-.5)*.08);Q.setFromEuler(E);
 const set=(m,y,k)=>m.setMatrixAt(i,M.compose(P.set(x,y*s,z),Q,Sv.setScalar(s*k)));
 set(mt,0,1);set(ca,4.2,1);set(cb,6.4,.7)}
sc.add(mt,ca,cb);
// lights to find, exit, chaser
const beam=(c,r,o)=>new R.Mesh(new R.CylinderGeometry(r,r,70,14,1,true),new R.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:R.AdditiveBlending,depthWrite:false,fog:false,side:R.DoubleSide}));
const rel=[];for(let i=0;i<5;i++){const m=new R.Group(),b=beam(0xffc66e,.25,.2);b.position.y=34;
 m.add(b,new R.Mesh(new R.OctahedronGeometry(.3),new R.MeshBasicMaterial({color:0xffe2a0,fog:false})));sc.add(m);rel.push({m,x:0,z:0})}
const ex=beam(0xd0e8ff,1.4,.28);ex.position.y=34;ex.visible=false;sc.add(ex);
const ch=new R.Mesh(new R.PlaneGeometry(1.4,3.6),new R.MeshBasicMaterial({map:new R.TextureLoader().load(IMG),transparent:true,depthWrite:false,side:R.DoubleSide}));sc.add(ch);
function mk(img){const c=document.createElement('canvas');c.width=240;c.height=620;const x=c.getContext('2d');
 const k=Math.max(240/img.width,620/img.height),w=img.width*k,h=img.height*k;
 x.filter='grayscale(.75) contrast(1.5) brightness(.75)';x.drawImage(img,(240-w)/2,(620-h)/2,w,h);x.filter='none';
 x.globalCompositeOperation='destination-in';x.translate(120,310);x.scale(1,2.58);
 const g=x.createRadialGradient(0,0,45,0,0,120);g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(-120,-120,240,240);return c}
$('f').onchange=e=>{const im=new Image;im.onload=()=>{ch.material.map=new R.CanvasTexture(mk(im));ch.material.needsUpdate=true};im.src=URL.createObjectURL(e.target.files[0])};
// audio
let A,mst,NB;
function aud(){if(A)return;A=new(window.AudioContext||window.webkitAudioContext)();mst=A.createGain();mst.gain.value=.8;mst.connect(A.destination);
 const lp=A.createBiquadFilter();lp.frequency.value=200;lp.connect(mst);const g=A.createGain();g.gain.value=.12;g.connect(lp);
 [55,55.8,82.4].forEach(f=>{const o=A.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(g);o.start()});
 NB=A.createBuffer(1,A.sampleRate*2,A.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const w=A.createBufferSource();w.buffer=NB;w.loop=true;const bp=A.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.6;
 const wg=A.createGain();wg.gain.value=.05;w.connect(bp);bp.connect(wg);wg.connect(mst);w.start()}
function tone(f,f2,d,ty,v){if(!A)return;const t=A.currentTime,o=A.createOscillator(),g=A.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mst);o.start();o.stop(t+d)}
function nz(d,fr,v){if(!A)return;const t=A.currentTime,s=A.createBufferSource(),b=A.createBiquadFilter(),g=A.createGain();s.buffer=NB;b.frequency.value=fr;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(b);b.connect(g);g.connect(mst);s.start();s.stop(t+d)}
// input
const K={},V=new R.Vector3();let S=0,px=0,pz=0,yaw=0,pit=0,st=1,tired=0,got=0,tt=0,tpT=16,hbT=1,stT=0,dT=0,exx=0,exz=0,mv=[0,0],tm=null,tl=null,drag=0,last=performance.now(),mT;
const cl=(v,a)=>Math.max(-a,Math.min(a,v));
const lock=()=>{try{const p=$('c').requestPointerLock();p&&p.catch&&p.catch(()=>{})}catch(e){}};
addEventListener('keydown',e=>K[e.code]=1);addEventListener('keyup',e=>K[e.code]=0);
$('c').addEventListener('mousedown',()=>{drag=1;if(S==1&&!document.pointerLockElement)lock()});addEventListener('mouseup',()=>drag=0);
addEventListener('mousemove',e=>{if(S==1&&(document.pointerLockElement||drag)){yaw-=e.movementX*.0024;pit=cl(pit-e.movementY*.0024,1.3)}});
$('c').addEventListener('touchstart',e=>{for(const t of e.changedTouches){const o={id:t.identifier,x:t.clientX,y:t.clientY};if(t.clientX<innerWidth/2)tm=o;else tl=o}},{passive:true});
$('c').addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(tm&&t.identifier==tm.id)mv=[cl((t.clientX-tm.x)/45,1.7),cl((t.clientY-tm.y)/45,1.7)];
 else if(tl&&t.identifier==tl.id){yaw-=(t.clientX-tl.x)*.006;pit=cl(pit-(t.clientY-tl.y)*.006,1.3);tl.x=t.clientX;tl.y=t.clientY}}},{passive:true});
$('c').addEventListener('touchend',e=>{for(const t of e.changedTouches){if(tm&&t.identifier==tm.id){tm=null;mv=[0,0]}if(tl&&t.identifier==tl.id)tl=null}});
// game
const say=t=>{const e=$('msg');e.textContent=t;e.style.opacity=1;clearTimeout(mT);mT=setTimeout(()=>e.style.opacity=0,3800)};
const show=(t,d,b)=>{$('t').textContent=t;$('d').textContent=d;$('go').textContent=b;$('ov').style.display='flex';$('hud').hidden=true};
function start(){aud();A.resume&&A.resume();px=pz=0;yaw=pit=0;st=1;tired=0;got=0;tt=0;tpT=16;hbT=1;
 const a=Math.random()*6.283;ch.position.set(Math.sin(a)*44,1.8,Math.cos(a)*44);ch.scale.setScalar(1);ch.material.depthTest=true;ch.renderOrder=0;
 rel.forEach((r,i)=>{const b=(i+Math.random()*.7)*1.2566,d=22+Math.random()*30;r.x=Math.sin(b)*d;r.z=-Math.cos(b)*d;r.m.position.set(r.x,1,r.z);r.m.visible=true});
 const q=Math.random()*6.283;exx=Math.sin(q)*54;exz=Math.cos(q)*54;ex.position.x=exx;ex.position.z=exz;ex.visible=false;
 $('ov').style.display='none';$('hud').hidden=false;S=1;lock();say('Find the five lights.')}
$('go').onclick=start;
function die(){S=2;dT=0;ch.material.depthTest=false;ch.renderOrder=9;document.exitPointerLock&&document.exitPointerLock();
 tone(900,240,1.2,'sawtooth',.6);tone(1150,300,1.2,'square',.35);nz(1.3,3500,1);
 const f=$('flash');f.style.transition='none';f.style.opacity=1;setTimeout(()=>{f.style.transition='opacity 1s';f.style.opacity=0},70)}
function win(){S=4;document.exitPointerLock&&document.exitPointerLock();tone(440,880,1.5,'sine',.4);show('You made it out.','The gate closes behind you. Somewhere in the trees, he keeps walking.','Go back in')}
function jump(dt){dT+=dt;cam.position.set(px+(Math.random()-.5)*.1,1.65+(Math.random()-.5)*.1,pz+(Math.random()-.5)*.1);cam.getWorldDirection(V);const k=1.2+dT*.5;
 ch.scale.setScalar(k);ch.position.set(cam.position.x+V.x,cam.position.y+.1-1.4*k,cam.position.z+V.z);ch.lookAt(cam.position.x,ch.position.y,cam.position.z);
 if(dT>1.5){S=4;show('He found you.','The woods go quiet again, as if nothing happened.','Run again')}}
function upd(dt){tt+=dt;yaw+=((K.ArrowLeft?1:0)-(K.ArrowRight?1:0))*dt*2.2;
 let f=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0)-mv[1],s=(K.KeyD?1:0)-(K.KeyA?1:0)+mv[0];
 const l0=Math.hypot(f,s);if(l0>1){f/=l0;s/=l0}
 const sp=(K.ShiftLeft||K.ShiftRight||Math.hypot(mv[0],mv[1])>1.4)&&l0>.1&&st>0&&!tired;
 if(sp){st-=dt*.28;if(st<=0){st=0;tired=1}}else{st=Math.min(1,st+dt*.14);if(tired&&st>.3)tired=0}
 const v=l0>.1?(sp?6.3:3.3):0,sn=Math.sin(yaw),cs=Math.cos(yaw);
 let nx=px+(-sn*f+cs*s)*v*dt,nz2=pz+(-cs*f-sn*s)*v*dt;
 for(let i=0;i<N;i++){const dx=nx-tx[i],dz=nz2-tz[i],rr=tr[i]+.4,d2=dx*dx+dz*dz;if(d2<rr*rr){const d=Math.sqrt(d2)||.01;nx=tx[i]+dx/d*rr;nz2=tz[i]+dz/d*rr}}
 px=cl(nx,58);pz=cl(nz2,58);cam.position.set(px,1.65+Math.sin(tt*(sp?14:9))*.04*(v>0),pz);cam.rotation.set(pit,yaw,0);
 if(v>0&&(stT-=dt)<=0){nz(.09,350+Math.random()*250,.5);stT=sp?.3:.5}
 const dx=px-ch.position.x,dz=pz-ch.position.z,d=Math.hypot(dx,dz)||1;
 cam.getWorldDirection(V);const seen=d<30&&(V.x*dx+V.z*dz)/(Math.hypot(V.x,V.z)*d)<-.8;
 const cv=(2.5+.55*got+(got==5?.3:0))*Math.min(1,tt/10)*(seen?.3:1);
 ch.position.x+=dx/d*cv*dt;ch.position.z+=dz/d*cv*dt;ch.position.y=1.8+Math.sin(tt*3)*.08;ch.lookAt(px,ch.position.y,pz);if(seen)ch.rotateZ((Math.random()-.5)*.1);
 if((tpT-=dt)<=0){if(!seen&&d>16){const a=Math.random()*6.283;ch.position.x=px+Math.sin(a)*13;ch.position.z=pz+Math.cos(a)*13;nz(.5,200,.6);tpT=14+Math.random()*8}else tpT=3}
 const pr=Math.max(0,1-d/26);
 if((hbT-=dt)<=0){if(pr>.04){tone(70,38,.18,'sine',.9);setTimeout(()=>tone(60,34,.2,'sine',.6),170)}hbT=1.15-pr*.8}
 fl.intensity=1.8*(Math.random()<(d<12?.12:.015)?.12:1);
 $('vig').style.boxShadow='inset 0 0 '+(pr*240|0)+'px rgba(150,0,0,'+(pr*.85).toFixed(2)+')';
 rel.forEach(r=>{if(r.m.visible){r.m.rotation.y+=dt;if(Math.hypot(px-r.x,pz-r.z)<1.8){r.m.visible=false;got++;tone(880,1320,.6,'sine',.4);
  if(got==5){ex.visible=true;say('The way out is lit. Run.')}else say(got+' of 5. He heard that.')}}});
 $('rl').textContent=got<5?'Lights '+got+' / 5':'Reach the white gate';$('sta').children[0].style.width=st*100+'%';
 if(got==5&&Math.hypot(px-exx,pz-exz)<2.4)return win();
 if(d<1.2)die()}
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 if(S==1)upd(dt);else if(S==2)jump(dt);else if(S==0){yaw+=dt*.05;cam.rotation.set(0,yaw,0)}
 rn.render(sc,cam)}
requestAnimationFrame(loop);
